plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.+'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

def artifactsFabricJar = layout.projectDirectory.file('libs/artifacts-fabric-15.1.3.jar')
def trinketsPolymerJar = layout.projectDirectory.file('libs/trinkets-polymer-patch-4.0.0-rc.1.0+26.1.jar')

tasks.register('downloadArtifacts') {
	def dest = artifactsFabricJar.asFile
	outputs.file(dest)
	onlyIf { !dest.exists() }
	doLast {
		dest.parentFile.mkdirs()
		ant.get(
			src: 'https://cdn.modrinth.com/data/P0Mu4wcQ/versions/RAHdA2ed/artifacts-fabric-15.1.3.jar',
			dest: dest
		)
	}
}

tasks.register('downloadTrinketsPolymer') {
	def dest = trinketsPolymerJar.asFile
	outputs.file(dest)
	onlyIf { !dest.exists() }
	doLast {
		dest.parentFile.mkdirs()
		ant.get(
			src: 'https://cdn.modrinth.com/data/G8hlgtEk/versions/MtPLTvWO/trinkets-polymer-patch-4.0.0-rc.1.0%2B26.1.jar',
			dest: dest
		)
	}
}

tasks.named('compileJava').configure {
	dependsOn tasks.named('downloadArtifacts')
	dependsOn tasks.named('downloadTrinketsPolymer')
}

repositories {
	maven { url = 'https://api.modrinth.com/maven/' }
	maven { url = 'https://maven.nucleoid.xyz' }
	maven { url = 'https://maven.ladysnake.org/releases' }
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Modrinth Maven's `15.1.3` coordinate resolves to a non-Fabric jar; use the Fabric release file.
	implementation files('libs/artifacts-fabric-15.1.3.jar')

	implementation "eu.pb4:polymer-core:${project.polymer_version}"
	implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	implementation "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
	implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
	implementation "eu.pb4:polymer-autohost:${project.polymer_version}"

	compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:8.0.0"

	// Dev / runServer: Artifacts trinkets + vanilla-safe inventory/registry sync (server-only mods).
	implementation "eu.pb4:trinkets:4.0.1+26.1"
	implementation files('libs/trinkets-polymer-patch-4.0.0-rc.1.0+26.1.jar')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
